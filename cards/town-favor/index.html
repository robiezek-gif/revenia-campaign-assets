<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Town Favor — Whinnying Ninny</title>
<style>
:root{--h:120;--cream:#eadcbb;--gold:#d7bd82;--gold2:#76582d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}
#app{width:100vw;height:100vh;position:relative;background:#050403}
.stage{position:absolute;inset:0 29.2% 0 0;overflow:hidden;background:#080605}
.art{position:absolute;inset:0;background:url("assets/stage.png") center/cover no-repeat}
.dress-tint{position:absolute;inset:0;background:url("assets/dress_overlay.png") center/cover no-repeat;filter:hue-rotate(calc((var(--h) - 120)*1deg)) saturate(1.14);opacity:1;transition:filter 1.2s ease;pointer-events:none}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 48% 42%,transparent 30%,rgba(0,0,0,.4) 100%),linear-gradient(90deg,transparent 65%,rgba(0,0,0,.4))}
.flash{position:absolute;z-index:20;left:50%;top:20%;transform:translate(-50%,-50%);font-size:32px;font-weight:bold;text-shadow:0 2px 15px #000;opacity:0}
.flash.show{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-30%)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-100%)}}
.dm-toggle,.dm-reopen{position:absolute;z-index:1000;right:16px;top:16px;padding:9px 13px;background:#17100b;color:#ead8b0;border:1px solid #76572f;border-radius:6px;cursor:pointer}.dm-reopen{display:none}.dm-hidden .dm{display:none}.dm-hidden .dm-toggle{display:none}.dm-hidden .dm-reopen{display:block}
.dm{position:absolute;z-index:100;right:0;top:0;bottom:0;width:29.2%;min-width:390px;padding:15px 13px;background:radial-gradient(circle at 50% 0,rgba(190,140,65,.09),transparent 32%),linear-gradient(135deg,#1a120d,#090807 52%,#160f0b);border-left:2px solid #6f542e;box-shadow:-15px 0 45px #000;overflow:auto}
.frame{border:1px solid #6e542d;border-radius:12px;padding:9px;background:rgba(9,7,5,.58);box-shadow:inset 0 0 0 2px rgba(120,88,40,.22),0 5px 12px #000;margin-bottom:9px}
.round{text-align:center;height:84px}.round-title{font-size:24px;margin-bottom:12px}.dots{display:flex;justify-content:center;gap:13px}.dot{width:23px;height:23px;border-radius:50%;border:1px solid #795d32;background:#15120f}.dot.active{background:#fff1bf;box-shadow:0 0 12px 4px rgba(255,210,110,.55)}
.quick-title{font-size:18px;padding:4px 4px 9px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.quick button{min-height:60px;font-size:13px;line-height:1.2;border:1px solid #74552b;border-radius:6px;color:#f1e6cf;background:linear-gradient(#315f3b,#16311e);padding:9px 5px}.quick .bad{background:linear-gradient(#783b38,#341311)}.quick .best{background:linear-gradient(#333967,#151a38)}
.favor{text-align:center;padding:12px}.favor .label{font-size:17px}.num{font-size:44px;line-height:1.1}.favor-attitude{font-size:14px}
.history{min-height:150px;max-height:310px;overflow:auto;background:#ded0b4;color:#2d241b;border-radius:6px;padding:13px;font-size:13px}.history.empty{text-align:center;padding-top:58px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button{border:1px solid #74552b;border-radius:6px;color:#f1e6cf;background:linear-gradient(#4d4a43,#24221f);padding:11px}.bottom .reset{background:linear-gradient(#743b35,#321512)}
.progress{font-size:13px;text-align:center;color:#cbb78f;margin-top:8px}
@media(max-width:1050px){.dm{width:38%;min-width:340px}.stage{inset-right:38%}}
</style>
</head>
<body>
<div id="app">
  <main class="stage"><div class="art"></div><div class="dress-tint"></div><div class="flash" id="flash"></div></main>
  <button class="dm-toggle" id="dmToggle">HIDE DM CONTROLS</button>
  <button class="dm-reopen" id="dmReopen">DM CONTROLS</button>
  <aside class="dm">
    <div class="frame round">
      <div class="round-title">Round <span id="round">1</span> of 5</div>
      <div class="dots" id="dots"></div>
      <div class="progress" id="progress">Check 1 of 4</div>
    </div>

    <div class="frame">
      <div class="quick-title">Enter Skill Check Result</div>
      <div class="quick">
        <button class="bad" data-v="-3">Natural 1<br>−3</button>
        <button class="bad" data-v="-2">−2<br>−2</button>
        <button class="bad" data-v="-1">−1<br>−1</button>
        <button data-v="+1">+1<br>+1</button>
        <button data-v="+2">+2<br>+2</button>
        <button class="best" data-v="+3">Natural 20<br>+3</button>
      </div>
    </div>

    <div class="frame favor">
      <div class="label">Current Favor</div>
      <div class="num" id="favor">0</div>
      <div class="favor-attitude" id="favorAttitude">Divided / 50-50</div>
    </div>

    <div class="frame">
      <div class="quick-title">Roll History</div>
      <div class="history empty" id="history">No rolls yet. Begin Round 1.</div>
    </div>

    <div class="bottom">
      <button id="next">Next Round</button>
      <button class="reset" id="reset">Reset Encounter</button>
    </div>
  </aside>
</div>
<script>
(()=>{"use strict";
const state={favor:0,round:1,check:1,history:[]};
const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function attitude(f){
 if(f<=-20)return["HOSTILE","The town turns against you."];
 if(f<=-10)return["SUSPICIOUS","The crowd is wary."];
 if(f<0)return["LEANING SUSPICIOUS","The mood is turning."];
 if(f===0)return["DIVIDED","50 / 50"];
 if(f<=9)return["LEANING SUPPORTIVE","The crowd is warming."];
 if(f<=19)return["SUPPORTIVE","The crowd is with you."];
 return["STRONGLY SUPPORTIVE","The town is firmly behind you."];
}
function hue(f){
 const s=[[-25,0],[-16.7,30],[-8.3,60],[0,120],[8.3,210],[16.7,260],[25,285]];
 f=clamp(f,-25,25);
 for(let i=0;i<s.length-1;i++)if(f<=s[i+1][0]){
   const[a,ah]=s[i],[b,bh]=s[i+1],t=(f-a)/(b-a);return ah+(bh-ah)*t;
 }
 return 285;
}
function render(){
 const [a]=attitude(state.favor);
 document.documentElement.style.setProperty("--h",hue(state.favor));
 $("round").textContent=state.round;
 $("progress").textContent=state.check<=4?`Check ${state.check} of 4`:"Round complete";
 $("dots").innerHTML=Array.from({length:5},(_,i)=>`<i class="dot ${i<state.round?"active":""}"></i>`).join("");



 $("history").innerHTML=state.history.length?state.history.map(x=>`<div><b>R${x.round}</b> — Check ${x.check} — ${x.change>0?"+":""}${x.change} — Favor ${x.favor>0?"+":""}${x.favor}</div>`).join(""):"No rolls yet. Begin Round 1.";
}
function flash(v){const f=$("flash");f.textContent=(v>0?"+":"")+v+" FAVOR";f.style.color=v>0?"#c9e8c8":v<0?"#f2a5a5":"#eadcbb";f.classList.remove("show");void f.offsetWidth;f.classList.add("show")}
function apply(v){
 if(state.check>4)return;
 state.favor=clamp(state.favor+v,-25,25);
 state.history.unshift({round:state.round,check:state.check,change:v,favor:state.favor});
 state.check++;
 render();flash(v);
}
const dmToggle=$("dmToggle");
const dmReopen=$("dmReopen");
if(dmToggle) dmToggle.addEventListener("click",()=>document.body.classList.add("dm-hidden"));
if(dmReopen) dmReopen.addEventListener("click",()=>document.body.classList.remove("dm-hidden"));

document.addEventListener("click",e=>{
 const q=e.target.closest(".quick button");
 if(q){apply(Number(q.dataset.v));return}
 if(e.target.closest("#next")){
   if(state.round>=5||state.check<=4)return;
   state.round++;state.check=1;render();return;
 }
 if(e.target.closest("#reset")){
   state.favor=0;state.round=1;state.check=1;state.history=[];render();return;
 }
});
render();
})();
</script>
</body>
</html>
