<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Town Favor — Whinnying Ninny</title>
<style>
:root{--h:120;--gold:#d7bd82;--gold2:#76582d;--cream:#eadcbb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
button,input{font:inherit}button{cursor:pointer}
#app{width:100vw;height:100vh;position:relative;background:#050403}
.stage{position:absolute;inset:0 29.2% 0 0;overflow:hidden;background:#080605}
.art,.dress-tint{position:absolute;inset:0;background:url("assets/stage.jpg") center/cover no-repeat}
.dress-tint{
 filter:hue-rotate(calc((var(--h) - 120) * 1deg)) saturate(1.14);
 clip-path:polygon(34% 12%,38% 11%,43% 13%,47% 18%,50% 24%,52% 31%,55% 40%,60% 50%,67% 64%,72% 75%,75% 83%,72% 91%,62% 93%,50% 92%,38% 94%,30% 90%,33% 80%,37% 68%,39% 57%,40% 46%,38% 37%,34% 29%,31% 23%);
 opacity:.88;transition:filter 1.2s ease
}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 48% 42%,transparent 30%,rgba(0,0,0,.43) 100%),linear-gradient(90deg,transparent 65%,rgba(0,0,0,.42))}
.attitude{position:absolute;z-index:10;left:50%;bottom:2.2%;transform:translateX(-50%);min-width:280px;padding:12px 55px;text-align:center;border:1px solid var(--gold2);border-radius:45%;background:linear-gradient(#241d14,#0b0907);box-shadow:0 0 0 3px #20170d,0 10px 30px #000}
.attitude .big{font-size:28px;letter-spacing:.13em}.attitude .small{font-size:13px;margin-top:3px}
.flash{position:absolute;z-index:20;left:50%;top:20%;transform:translate(-50%,-50%);font-size:32px;font-weight:bold;text-shadow:0 2px 15px #000;opacity:0}.flash.show{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-30%)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-100%)}}
.dm{position:absolute;z-index:100;right:0;top:0;bottom:0;width:29.2%;min-width:390px;padding:15px 13px;background:radial-gradient(circle at 50% 0,rgba(190,140,65,.09),transparent 32%),linear-gradient(135deg,#1a120d,#090807 52%,#160f0b);border-left:2px solid #6f542e;box-shadow:-15px 0 45px #000;overflow:auto}
.frame{border:1px solid #6e542d;border-radius:12px;padding:9px;background:rgba(9,7,5,.58);box-shadow:inset 0 0 0 2px rgba(120,88,40,.22),0 5px 12px #000;margin-bottom:9px}
.round{text-align:center;height:84px}.round-title{font-size:24px;margin-bottom:12px}.dots{display:flex;justify-content:center;gap:13px}.dot{width:23px;height:23px;border-radius:50%;border:1px solid #795d32;background:#15120f}.dot.active{background:#fff1bf;box-shadow:0 0 12px 4px rgba(255,210,110,.55)}
.section-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:4px}.dc{border:1px solid #8d6d38;border-radius:5px;padding:5px 9px}
.pc{display:grid;grid-template-columns:1fr 66px 55px 55px;gap:7px;align-items:center;padding:8px;border-top:1px solid #3c2d1c}.pc-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result{width:66px;padding:9px 4px;text-align:center;background:#ded7c8;color:#443d32;border:2px solid #75654e;border-radius:6px}.enter,.clear,.quick button,.bottom button{border:1px solid #74552b;border-radius:6px;color:#f1e6cf;background:linear-gradient(#315f3b,#16311e);padding:9px 5px}.clear{background:linear-gradient(#713b34,#321514)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.quick button{min-height:52px;font-size:12px;line-height:1.2}.quick .bad{background:linear-gradient(#783b38,#341311)}.quick .best{background:linear-gradient(#333967,#151a38)}
.favor{text-align:center;padding:10px}.favor .label{font-size:16px}.num{font-size:42px}.history{min-height:130px;max-height:190px;overflow:auto;background:#ded0b4;color:#2d241b;border-radius:6px;padding:13px;font-size:12px}.history.empty{text-align:center;padding-top:48px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button{background:linear-gradient(#4d4a43,#24221f);padding:11px}.bottom .reset{background:linear-gradient(#743b35,#321512)}
.player{position:absolute;z-index:1000;right:16px;top:16px;padding:9px 13px;background:#17100b;color:#ead8b0;border:1px solid #76572f;border-radius:6px}
.only-player .stage{inset:0}.only-player .dm,.only-player .player{display:none}.only-player .attitude{display:none}
.only-player .art,.only-player .dress-tint{background-position:center}
@media(max-width:1050px){.dm{width:38%;min-width:340px}.stage{inset-right:38%}}
</style>
</head>
<body>
<div id="app">
  <main class="stage">
    <div class="art"></div><div class="dress-tint"></div>
    <div class="attitude"><div class="big" id="attitude">DIVIDED</div><div class="small" id="attitudeSub">50 / 50</div></div>
    <div class="flash" id="flash"></div>
  </main>
  <button class="player" id="player">OPEN PLAYER DISPLAY</button>

  <aside class="dm">
    <div class="frame round"><div class="round-title">Round <span id="round">1</span> of 5</div><div class="dots" id="dots"></div></div>
    <div class="frame">
      <div class="section-head"><span>Enter Skill Check Result</span><span class="dc">DC 16</span></div>
      <div id="pcs"></div>
    </div>
    <div class="frame">
      <div class="section-head">Quick Result Buttons</div>
      <div class="quick">
        <button class="bad" data-v="-3">Natural 1<br>−3</button>
        <button class="bad" data-v="-1">Failure<br>−1</button>
        <button data-v="+1">Success<br>+1</button>
        <button class="best" data-v="+3">Natural 20<br>+3</button>
      </div>
    </div>
    <div class="frame favor"><div class="label">Current Favor</div><div class="num" id="favor">0</div><div id="favorAttitude">Divided / 50-50</div></div>
    <div class="frame"><div class="section-head">Roll History</div><div class="history empty" id="history">No rolls yet. Begin Round 1.</div></div>
    <div class="bottom"><button id="next">Next Round</button><button class="reset" id="reset">Reset Encounter</button></div>
  </aside>
</div>

<script>
(() => {
"use strict";
const isPlayer=new URLSearchParams(location.search).get("mode")==="player";
const channel="town-favor-v1";
const bc="BroadcastChannel" in window ? new BroadcastChannel(channel) : null;
const state={favor:0,round:1,used:[false,false,false,false],pcs:["Elaria","Korgrim Ironhammer","Sulnaa","Lokrem"],history:[]};
const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function attitude(f){
 if(f<=-20)return["HOSTILE","The town turns against you."];
 if(f<=-10)return["SUSPICIOUS","The crowd is wary."];
 if(f<0)return["LEANING SUSPICIOUS","The mood is turning."];
 if(f===0)return["DIVIDED","50 / 50"];
 if(f<=9)return["LEANING SUPPORTIVE","The crowd is warming."];
 if(f<=19)return["SUPPORTIVE","The crowd is with you."];
 return["STRONGLY SUPPORTIVE","The town is firmly behind you."];
}
function hue(f){
 const s=[[-25,0],[-16.7,30],[-8.3,60],[0,120],[8.3,210],[16.7,260],[25,285]];
 f=clamp(f,-25,25);
 for(let i=0;i<s.length-1;i++)if(f<=s[i+1][0]){
   const[a,ah]=s[i],[b,bh]=s[i+1],t=(f-a)/(b-a);return ah+(bh-ah)*t;
 }
 return 285;
}
function send(){bc&&bc.postMessage({type:"state",state:JSON.parse(JSON.stringify(state))})}
function render(){
 const [a,sub]=attitude(state.favor);
 document.documentElement.style.setProperty("--h",hue(state.favor));
 $("attitude").textContent=a;$("attitudeSub").textContent=sub;
 $("favor").textContent=state.favor>0?"+"+state.favor:state.favor;
 $("favorAttitude").textContent=state.favor===0?"Divided / 50-50":a;
 $("round").textContent=state.round;
 $("dots").innerHTML=Array.from({length:5},(_,i)=>`<i class="dot ${i<state.round?"active":""}"></i>`).join("");
 $("pcs").innerHTML=state.pcs.map((p,i)=>`
   <div class="pc">
    <div class="pc-name">${esc(p)}</div>
    <input class="result" id="r${i}" type="number" min="-3" max="3" placeholder="±">
    <button class="enter" data-enter="${i}">Enter</button>
    <button class="clear" data-clear="${i}">Clear</button>
   </div>`).join("");
 document.querySelectorAll("[data-enter]").forEach(b=>b.disabled=state.used[+b.dataset.enter]);
 document.querySelectorAll("[data-clear]").forEach(b=>b.disabled=state.used[+b.dataset.clear]);
 $("history").className="history"+(state.history.length?"":" empty");
 $("history").innerHTML=state.history.length?state.history.map(x=>`<div><b>R${x.round}</b> — ${esc(x.pc)} — ${x.change>0?"+":""}${x.change} — Favor ${x.favor>0?"+":""}${x.favor}</div>`).join(""):"No rolls yet. Begin Round 1.";
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function apply(i,v){
 if(state.used[i])return;
 state.favor=clamp(state.favor+v,-25,25);state.used[i]=true;
 state.history.unshift({round:state.round,pc:state.pcs[i],change:v,favor:state.favor});
 render();flash(v);send();
}
function flash(v){if(isPlayer)return;const f=$("flash");f.textContent=(v>0?"+":"")+v+" FAVOR";f.style.color=v>0?"#c9e8c8":v<0?"#f2a5a5":"#eadcbb";f.classList.remove("show");void f.offsetWidth;f.classList.add("show")}
function enter(i){const e=$("r"+i);if(!e.value)return;const v=Number(e.value);if(!Number.isInteger(v)||v<-3||v>3){e.value="";return}apply(i,v)}
function reset(){state.favor=0;state.round=1;state.used=[false,false,false,false];state.history=[];render();send()}
function next(){if(state.round>=5||state.used.some(x=>!x))return;state.round++;state.used=[false,false,false,false];render();send()}

document.addEventListener("click",e=>{
 const q=e.target.closest(".quick button"); if(q){const i=state.used.findIndex(x=>!x);if(i>=0)apply(i,Number(q.dataset.v));return}
 const en=e.target.closest("[data-enter]");if(en){enter(+en.dataset.enter);return}
 if(e.target.closest("#next")){next();return}
 if(e.target.closest("#reset")){reset();return}
 if(e.target.closest("#player")){window.open(location.pathname+"?mode=player","TownFavorPlayer","width=1600,height=900");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("result"))enter(+e.target.id.slice(1))});

if(bc)bc.onmessage=e=>{if(e.data?.type==="state"){Object.assign(state,e.data.state);render()}};

if(isPlayer){
 document.body.classList.add("only-player");
 render();
}else{
 render();
}
})();
</script>
</body>
</html>
